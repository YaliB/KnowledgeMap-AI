name: KnowledgeMap AI Continuous Integration & Deployment

on:
  push:
    branches: [ "main", "dev", "ci-deployment" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  integration-testing:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      neo4j:
        image: neo4j:5.18-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/test_secure_password
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies via Pip
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Tests
      env:
        OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USERNAME: neo4j
        NEO4J_PASSWORD: test_secure_password
        NEO4J_DBNAME: neo4j
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DB: test_knowledgemap
        SESSION_SECRET: ci_test_secret_string
        SESSION_EXPIRE_DAYS: 7
        ALLOWED_ORIGINS: '["http://localhost:3000"]'
        MAX_FILE_SIZE_MB: 20
        USE_S3: false
      run: |
        cd backend
        pytest tests/

  build-and-push-backend:
    needs: integration-testing
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Backend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cp requirements.txt backend/
        docker build -t $ECR_REGISTRY/knowledgemap-backend:$IMAGE_TAG \
                     -t $ECR_REGISTRY/knowledgemap-backend:latest \
                     ./backend
        docker push $ECR_REGISTRY/knowledgemap-backend:$IMAGE_TAG
        docker push $ECR_REGISTRY/knowledgemap-backend:latest

  build-and-push-frontend:
    needs: integration-testing
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Frontend Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
          -t $ECR_REGISTRY/knowledgemap-frontend:$IMAGE_TAG \
          -t $ECR_REGISTRY/knowledgemap-frontend:latest \
          ./frontend
        docker push $ECR_REGISTRY/knowledgemap-frontend:$IMAGE_TAG
        docker push $ECR_REGISTRY/knowledgemap-frontend:latest

  deploy-backend:
    needs: build-and-push-backend
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Deploy Backend to ECS
      run: |
        aws ecs update-service \
          --cluster knowledgemap \
          --service knowledgemap-backend \
          --force-new-deployment

  deploy-frontend:
    needs: build-and-push-frontend
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-central-1

    - name: Deploy Frontend to ECS
      run: |
        aws ecs update-service \
          --cluster knowledgemap \
          --service knowledgemap-frontend \
          --force-new-deployment
