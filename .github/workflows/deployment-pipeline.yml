name: KnowledgeMap AI Continuous Integration & Deployment

on:
  push:
    branches: [ "main", "dev", "ci-deployment" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  integration-testing:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      neo4j:
        image: neo4j:5.12-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/test_secure_password
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies via Pip
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Test Matrix
      env:
        OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: test_secure_password
        NEO4J_DATABASE: neo4j
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DB: test_knowledgemap
        SESSION_SECRET: ci_test_secret_string
        ALLOWED_ORIGINS: http://localhost:3000
        UPLOAD_DIR: ./test_uploads
        MAX_FILE_SIZE_MB: 20
      run: |
        cd backend
        pytest tests/

  build-and-push-backend:
    needs: integration-testing
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/knowledgemap-backend:$IMAGE_TAG ./backend
        docker push $ECR_REGISTRY/knowledgemap-backend:$IMAGE_TAG

  deploy-backend:
    needs: build-and-push-backend
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Container to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        ECR_REGISTRY: ${{ needs.build-and-push-backend.outputs.ecr-registry }}
        IMAGE_TAG: ${{ github.sha }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: ECR_REGISTRY,IMAGE_TAG
        script: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY
          docker pull $ECR_REGISTRY/knowledgemap-backend:$IMAGE_TAG
          docker stop fastapi || true
          docker rm fastapi || true
          docker run -d \
            --name fastapi \
            --restart unless-stopped \
            -p 8000:8000 \
            --env-file /home/ubuntu/.env \
            $ECR_REGISTRY/knowledgemap-backend:$IMAGE_TAG

  deploy-frontend:
    needs: integration-testing
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Trigger Amplify Build
      run: |
        aws amplify start-job \
          --app-id ${{ secrets.AMPLIFY_APP_ID }} \
          --branch-name ${{ github.ref_name }} \
          --job-type RELEASE