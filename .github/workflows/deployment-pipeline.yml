name: KnowledgeMap AI Continuous Integration & Deployment

on:
  push:
    branches: [ "main", "dev", "ci-deployment" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  integration-testing:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      neo4j:
        image: neo4j:5.12-community
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/test_secure_password
    steps:
    - name: Checkout Code Base
      uses: actions/checkout@v4

    - name: Initialize Python 3.11 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies via Pip
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Test Matrix
      env:
        OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: test_secure_password
        NEO4J_DATABASE: neo4j
        MONGODB_URI: mongodb://localhost:27017
        MONGODB_DB: test_knowledgemap
        SESSION_SECRET: ci_test_secret_string
        ALLOWED_ORIGINS: http://localhost:3000
        UPLOAD_DIR: ./test_uploads
        MAX_FILE_SIZE_MB: 20
      run: |
        cd backend
        pytest tests/

  continuous-deployment:
    needs: integration-testing
    if: github.ref == 'refs/heads/ci-deployment' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Execute Remote SSH Commands for CD
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/KnowledgeMap-AI
          git checkout ci-deployment
          git pull origin ci-deployment
          source backend/venv/bin/activate
          pip install -r backend/requirements.txt
          sudo systemctl restart fastapi